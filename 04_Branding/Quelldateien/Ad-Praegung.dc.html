<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ad Die Prägung ist die Dosis</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#EDF1F2}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 80px; background: #1F2C7A; color: #EDF1F2; display: flex; flex-direction: column; gap: 56px; font-family: 'Instrument Sans', sans-serif">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 120px; line-height: 0.9; letter-spacing: -0.045em">Die Prägung ist die Dosis.</h1>
<div style="flex: 1; display: flex; align-items: center; justify-content: center">
<div style="position: relative; overflow: hidden; width: 680px; height: 456px; border-radius: 228px; background: #F7F9FA; display: flex; align-items: center; justify-content: center">
<div style="position: absolute; width: 150px; height: 150px; border-radius: 50%; background: #1F2C7A; top: -66px; right: 60px"></div>
<div style="position: absolute; width: 110px; height: 110px; border-radius: 50%; background: #1F2C7A; top: -62px; right: 186px"></div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 250px; letter-spacing: -0.05em; color: #E6EBF0; text-shadow: 0 -3px 0 #c3cad6, 0 3px 0 #ffffff">30</div>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 30px; line-height: 1.35">Jedes Stück: 30 mg Koffein, 0 g Zucker.<br>Du weißt immer, wo du stehst.</div>
<div style="font-size: 18px; color: #9aa4c9">Enthält Koffein. Für Kinder und schwangere Frauen nicht empfohlen.</div>
</div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; letter-spacing: -0.05em; color: {{accent}}">BISS</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B1F","options":["#FF6B1F","#9FE3C8","#F2D23C"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FF6B1F' };
}
}
</script>
</body>
</html>
