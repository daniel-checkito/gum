<!doctype html>
<html lang="de">
<head>

<title>BISS Automat-Folierung</title>
<script src="./support.js"></script>
</head>

<x-dc>

<style>
body{margin:0}
a{color:#1F2C7A}a:hover{color:#121a4d}
</style>
</helmet>
<div style="width: 640px; height: 1100px; box-sizing: border-box; padding: 40px; background: #DDE3EA; font-family: 'Instrument Sans', sans-serif; color: #EDF1F2">
<div style="position: relative; overflow: hidden; width: 560px; height: 1020px; background: #1F2C7A; border-radius: 22px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px">

</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; font-size: 12px; text-align: center"><span>A1 3,00 €</span><span>A2 3,00 €</span><span>A3 3,00 €</span></div>
</div>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B1F","options":["#FF6B1F","#9FE3C8","#F2D23C"]},"$preview":{"width":640,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FF6B1F' };
}
}
</script>
