<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Plakat Dose gegen Dose</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2C7A}a:hover{color:#121a4d}
</style>
</helmet>
<div style="width: 1000px; height: 1414px; box-sizing: border-box; padding: 72px; background: #EDF1F2; color: #1F2C7A; display: flex; flex-direction: column; gap: 64px; font-family: 'Instrument Sans', sans-serif">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 168px; line-height: 0.88; letter-spacing: -0.05em">Dose gegen Dose.</h1>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px; align-items: end; flex: 1">
<div style="display: flex; flex-direction: column; gap: 28px; align-items: center">
<div style="width: 200px; height: 400px; border-radius: 30px 30px 24px 24px; background: #b9c2d6; box-shadow: inset 0 18px 0 #a6b0c6, inset 0 -18px 0 #a6b0c6"></div>
<div style="text-align: center; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 72px; line-height: 1; color: #6b75a8">27 g</span>
<span style="font-size: 22px; color: #4a548f">Zucker in einer Energy-Dose, 250 ml</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 28px; align-items: center">
<div style="width: 320px; height: 250px; border-radius: 28px; background: #1F2C7A; box-shadow: inset 0 0 0 5px #18235f, inset 0 0 0 6px #2b3a92; box-sizing: border-box; padding: 26px; display: flex; flex-direction: column; justify-content: space-between">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 90px; line-height: 0.85; letter-spacing: -0.05em; color: #24318a; text-shadow: 0 -2px 0 #0f1748, 0 2px 0 #3d4db0">BISS</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; color: {{accent}}">30 mg</span>
</div>
<div style="text-align: center; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 72px; line-height: 1">0 g</span>
<span style="font-size: 22px">Zucker in unserer Dose</span>
</div>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; letter-spacing: -0.02em">BISS. Biss haben. Ohne Zucker.</div>
<div style="font-size: 15px; color: #4a548f; max-width: 280px; text-align: right">Enthält Koffein. Für Kinder und schwangere Frauen nicht empfohlen. [Quelle Zuckerangabe]</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B1F","options":["#FF6B1F","#9FE3C8","#F2D23C"]},"$preview":{"width":1000,"height":1414}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FF6B1F' };
}
}
</script>
</body>
</html>
