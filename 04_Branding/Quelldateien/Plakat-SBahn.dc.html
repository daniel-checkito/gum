<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Plakat Meeting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#EDF1F2}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1000px; height: 1414px; box-sizing: border-box; padding: 72px; background: #0f1748; color: #EDF1F2; display: flex; flex-direction: column; gap: 56px; font-family: 'Instrument Sans', sans-serif">
<div style="background: #070b26; border-radius: 20px; padding: 32px 36px; display: flex; flex-direction: column; gap: 18px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 34px; color: {{accent}}">
<div style="display: flex; justify-content: space-between"><span>Standup</span><span>9:30</span></div>
<div style="display: flex; justify-content: space-between"><span>Kundencall</span><span>11:00</span></div>
<div style="display: flex; justify-content: space-between; color: #6b75a8"><span>Abstimmung zur Abstimmung</span><span>15:00</span></div>
</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 112px; line-height: 0.92; letter-spacing: -0.045em">Dieses Meeting hätte eine Mail sein können.</h1>
<div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 56px; letter-spacing: -0.05em">BISS</div>
<div style="font-size: 24px; line-height: 1.4">Deadline: Eisminze.<br>30 mg Koffein, 0 g Zucker.</div>
</div>
<div style="width: 330px; height: 258px; border-radius: 28px; background: #1F2C7A; box-shadow: inset 0 0 0 5px #18235f, inset 0 0 0 6px #2b3a92; box-sizing: border-box; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; transform: rotate(-8deg)">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 92px; line-height: 0.85; letter-spacing: -0.05em; color: #24318a; text-shadow: 0 -2px 0 #0f1748, 0 2px 0 #3d4db0">BISS</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 38px; color: {{accent}}">30 mg</span>
</div>
</div>
<div style="font-size: 16px; color: #9aa4c9">Enthält Koffein. Für Kinder und schwangere Frauen nicht empfohlen.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B1F","options":["#FF6B1F","#9FE3C8","#F2D23C"]},"$preview":{"width":1000,"height":1414}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FF6B1F' };
}
}
</script>
</body>
</html>
