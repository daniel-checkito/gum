<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ad Zieh dir eine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2C7A}a:hover{color:#121a4d}
</style>
</helmet>
<div style="width: 1080px; height: 1920px; box-sizing: border-box; padding: 160px 80px 200px 80px; background: #EDF1F2; color: #1F2C7A; display: flex; flex-direction: column; gap: 64px; font-family: 'Instrument Sans', sans-serif">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 180px; line-height: 0.88; letter-spacing: -0.05em">Zieh dir eine.</h1>
<div style="background: #1F2C7A; border-radius: 36px; padding: 48px; display: flex; flex-direction: column; gap: 28px">
<div style="background: #2c3a8f; border: 4px solid #3b4aa3; border-radius: 22px; padding: 36px; display: flex; gap: 28px; justify-content: center">
<div style="width: 250px; height: 196px; border-radius: 24px; background: #1F2C7A; box-shadow: inset 0 0 0 5px #18235f, inset 0 0 0 6px #2b3a92; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; justify-content: space-between">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 70px; line-height: 0.85; letter-spacing: -0.05em; color: #24318a; text-shadow: 0 -2px 0 #0f1748, 0 2px 0 #3d4db0">BISS</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; color: #9FE3C8">Deadline</span>
</div>
<div style="width: 250px; height: 196px; border-radius: 24px; background: #1F2C7A; box-shadow: inset 0 0 0 5px #18235f, inset 0 0 0 6px #2b3a92; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; justify-content: space-between">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 70px; line-height: 0.85; letter-spacing: -0.05em; color: #24318a; text-shadow: 0 -2px 0 #0f1748, 0 2px 0 #3d4db0">BISS</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; color: #F2D23C">Deep Work</span>
</div>
</div>
<div style="display: flex; justify-content: space-between; color: #EDF1F2; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px">
<span>Fach B3</span>
<span style="color: {{accent}}">4,00 €</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 1">Ab [Datum] im Automaten</div>
<div style="font-size: 36px; line-height: 1.35">[Coworking], [Straße], Berlin</div>
</div>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end">
<div style="font-size: 20px; color: #4a548f; max-width: 560px">30 mg Koffein pro Stück, 0 g Zucker. Enthält Koffein. Für Kinder und schwangere Frauen nicht empfohlen.</div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 72px; letter-spacing: -0.05em">BISS</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B1F","options":["#FF6B1F","#9FE3C8","#F2D23C"]},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FF6B1F' };
}
}
</script>
</body>
</html>
